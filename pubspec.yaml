name: flauncher
description: Postlounge TV — white-label Android TV launcher (FLauncher fork).

version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^0.8.4+2
  intl: ^0.17.0
  moor: ^4.6.1+1
  moor_inspector: ^0.3.1
  path_provider: ^2.0.5
  package_info_plus: ^1.0.6
  provider: ^6.0.1
  shared_preferences: ^2.0.8
  sqlite3_flutter_libs: ^0.5.0
  unsplash_client: ^2.1.0
  webview_flutter: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.0
  lints: ^3.0.0
  mockito: ^5.4.6
  network_image_mock: ^2.0.1
  transparent_image: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
