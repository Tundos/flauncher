name: flauncher
description: Postlounge TV — white-label Android TV launcher (FLauncher fork).

version: 0.0.1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.2.0
  intl: ^0.19.0
  moor: ^4.6.1+1
  moor_inspector: ^0.3.1
  path_provider: ^2.1.5
  package_info_plus: ^8.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  sqlite3_flutter_libs: ^0.5.29
  unsplash_client: ^2.1.0
  video_player: ^2.9.2
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.0
  lints: ^3.0.0
  mockito: ^5.4.6
  network_image_mock: ^2.0.1
  transparent_image: ^2.0.0

dependency_overrides:
  flutter_plugin_android_lifecycle: ^2.0.28
  file: ^7.0.1
  platform: ^3.1.6
  # 0.8.13+25 ships Kotlin-only Pigeon types; javac fails under our AGP graph — use Java Messages.
  image_picker_android: 0.8.12+22

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/videos/
